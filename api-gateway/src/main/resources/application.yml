server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      routes:
        - id: questionnaires-service
          uri: lb://QUESTIONNAIRES-SERVICE
          predicates:
            - Path=/questionnaires/**
          filters:
            - StripPrefix=1
        - id: dashboards-service
          uri: lb://DASHBOARDS-SERVICE
          predicates:
            - Path=/dashboards/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
