global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "questionnaires-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["questionnaires-service:8085"]

  - job_name: "dashboards-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["dashboards-service:8086"]

  - job_name: "notifications-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notifications-service:8088"]
