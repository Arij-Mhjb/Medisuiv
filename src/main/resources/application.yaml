server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/configs
      import-check:
        enabled: false
  thymeleaf:
    check-template-location: false

management:
  endpoints:
    web:
      exposure:
        include: "*"