server:
  port: 8086

spring:
  data:
    mongodb:
      uri: mongodb://mongo:27017/medisuiv_dashboards
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/medisuiv-realm

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
